name: Build APK M-Fetch

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Tarik Kode dari Repo
        uses: actions/checkout@v4

      - name: Proses Build APK pakai Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          buildozer_version: master

      - name: Simpan Hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: M-Fetch-APK
          path: bin/*.apk
